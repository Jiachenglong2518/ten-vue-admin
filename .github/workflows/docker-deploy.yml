name: Docker Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  docker-deploy:
    name: Deploy Docker Container
    if: github.actor != 'dependabot[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build web-antd Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./scripts/deploy/Dockerfile
        build-args: |
          BUILD_SCRIPT=build:antd
          DIST_PATH=apps/web-antd/dist
        tags: ten-vue-admin-web-antd:latest
        load: true
        cache-from: type=gha,scope=web-antd
        cache-to: type=gha,mode=max,scope=web-antd

    - name: Build playground Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./scripts/deploy/Dockerfile
        build-args: |
          BUILD_SCRIPT=build:play
          DIST_PATH=playground/dist
        tags: ten-vue-admin-playground:latest
        load: true
        cache-from: type=gha,scope=playground
        cache-to: type=gha,mode=max,scope=playground

    - name: Save and compress Docker images
      run: docker save ten-vue-admin-web-antd:latest ten-vue-admin-playground:latest | gzip -1 > ten-vue-admin.tar.gz

    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: ten-vue-admin.tar.gz
        retention-days: 1

    - name: Deploy to server
      uses: appleboy/scp-action@v0.1.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "ten-vue-admin.tar.gz"
        target: "/tmp/"

    - name: Run deployment script on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /app/ten-vue-admin
          # 停止并删除旧容器
          docker stop ten-vue-admin ten-vue-admin-playground || true
          docker rm ten-vue-admin ten-vue-admin-playground || true
          # 解压并加载新镜像
          gzip -dc /tmp/ten-vue-admin.tar.gz | docker load
          # 启动 web-antd
          docker run -d \
            --name ten-vue-admin \
            -p 8080:80 \
            --restart unless-stopped \
            ten-vue-admin-web-antd:latest
          # 启动 playground
          docker run -d \
            --name ten-vue-admin-playground \
            -p 8081:80 \
            --restart unless-stopped \
            ten-vue-admin-playground:latest
          # 清理临时文件
          rm -f /tmp/ten-vue-admin.tar.gz
          echo "Docker deployment completed successfully!"
          echo "web-antd available at: http://${{ secrets.SERVER_HOST }}:8080"
          echo "playground available at: http://${{ secrets.SERVER_HOST }}:8081"
