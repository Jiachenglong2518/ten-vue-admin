name: Docker Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  docker-deploy:
    name: Deploy Docker Container
    if: github.actor != 'dependabot[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    
    steps:
    - name: Run deployment script on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /app/ten-vue-admin
          git fetch origin main
          git pull --ff-only origin main
          # 服务器本地构建最新代码
          docker build -f scripts/deploy/Dockerfile -t ten-vue-admin-web-antd:latest .
          # 停止并删除旧容器
          docker stop ten-vue-admin || true
          docker rm ten-vue-admin || true
          # 启动新容器
          docker run -d \
            --name ten-vue-admin \
            -p 8080:80 \
            --restart unless-stopped \
            ten-vue-admin-web-antd:latest
          echo "Docker deployment completed successfully!"
          echo "Service available at: http://${{ secrets.SERVER_HOST }}:8080"